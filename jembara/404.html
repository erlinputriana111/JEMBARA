<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Halaman Tidak Ditemukan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="manifest" href="/assets/site.webmanifest">
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center px-4">

  <div class="text-center max-w-md w-full">

    <!-- Angka 404 -->
    <div class="relative inline-flex items-center justify-center mb-6">
      <span class="text-[130px] md:text-[160px] font-black text-gray-200 leading-none select-none">404</span>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="bg-white rounded-2xl shadow-md p-4">
          <i data-lucide="file-x" class="w-12 h-12 text-red-800"></i>
        </div>
      </div>
    </div>

    <!-- Pesan -->
    <h1 class="text-xl font-bold text-gray-800 mb-2">Halaman Tidak Ditemukan</h1>
    <p class="text-gray-400 text-sm mb-8 leading-relaxed">
      Halaman yang kamu cari tidak ada, sudah dipindahkan,<br/>
      atau URL yang kamu masukkan salah.
    </p>

    <!-- Tombol -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="javascript:history.back()"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 border border-gray-200 text-gray-600 hover:bg-gray-50 rounded-xl text-sm font-semibold transition">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Kembali
      </a>
    </div>

    <!-- Branding -->
    <p class="text-gray-300 text-xs mt-10">DPRD Kabupaten Jember &mdash; Sistem Informasi Tamu</p>

  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
